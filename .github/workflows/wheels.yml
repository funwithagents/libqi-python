name: Wheels

on:
  push:
    # Release: build the wheels and publish them in a GitHub Release.
    tags:
      - "v*"
    # Also on master, when build-related files change (the paths below do not
    # apply to tags): the Conan cache it saves can then be used by the pull
    # requests (a cache saved by a pull request is only visible to itself).
    branches:
      - master
    paths:
      - "src/**"
      - "qipython/**"
      - "qi/**"
      - "cmake/**"
      - "ci/**"
      - "CMakeLists.txt"
      - "conanfile.py"
      - "pyproject.toml"
      - ".github/workflows/wheels.yml"
  # Check that the wheels still build, only when build-related files change.
  pull_request:
    branches:
      - master
    paths:
      - "src/**"
      - "qipython/**"
      - "qi/**"
      - "cmake/**"
      - "ci/**"
      - "CMakeLists.txt"
      - "conanfile.py"
      - "pyproject.toml"
      - ".github/workflows/wheels.yml"
  # Manual run from the Actions tab.
  workflow_dispatch:

# A new push on a PR cancels its build still in progress (builds on master and
# on tags are never cancelled).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  build_wheels:
    name: Wheels ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x86_64
            os: ubuntu-24.04
          - name: linux-aarch64
            os: ubuntu-24.04-arm
          - name: macos-arm64
            os: macos-15
          - name: macos-x86_64
            os: macos-15-intel
          - name: windows-x64
            os: windows-2025

    steps:
      - uses: actions/checkout@v7

      # On macOS and Windows, the Conan dependencies are built on the runner
      # itself, so their cache can be kept between runs (on Linux they are
      # built inside the manylinux container).
      - name: Install Conan (macOS, Windows)
        if: runner.os != 'Linux'
        run: pipx install 'conan>=2'

      # cibuildwheel runs `bash` from cmd: make sure it is Git Bash, not WSL.
      - name: Use Git Bash (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: '"C:\Program Files\Git\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append'

      # Saved even if the build fails (but not if it is cancelled, the cache
      # could be incomplete), so that the dependencies already built are not
      # rebuilt on the next run.
      - name: Restore Conan packages (macOS, Windows)
        if: runner.os != 'Linux'
        uses: actions/cache/restore@v6
        with:
          path: ~/.conan2/p
          key: conan-${{ matrix.name }}-${{ hashFiles('conanfile.py', 'ci/conan_deps.sh') }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: conan-${{ matrix.name }}-${{ hashFiles('conanfile.py', 'ci/conan_deps.sh') }}-

      - name: Build wheels
        uses: pypa/cibuildwheel@v4.2.1

      - name: Save Conan packages (macOS, Windows)
        if: (success() || failure()) && runner.os != 'Linux'
        uses: actions/cache/save@v6
        with:
          path: ~/.conan2/p
          key: conan-${{ matrix.name }}-${{ hashFiles('conanfile.py', 'ci/conan_deps.sh') }}-${{ github.run_id }}-${{ github.run_attempt }}

      - uses: actions/upload-artifact@v7
        with:
          name: wheels-${{ matrix.name }}
          path: wheelhouse/*.whl

  release:
    name: GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build_wheels
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      actions: write

    steps:
      - uses: actions/checkout@v7

      # A tag "vX.Y.Z" (or "vX.Y.Z-rcN") must match the version in pyproject.toml.
      - name: Check tag matches package version
        run: |
          tag_version="${GITHUB_REF_NAME#v}"
          tag_version="${tag_version%%-*}"
          package_version=$(sed -nE 's/^version = "(.*)"/\1/p' pyproject.toml)
          if [ "$tag_version" != "$package_version" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match version $package_version in pyproject.toml"
            exit 1
          fi

      - uses: actions/download-artifact@v8
        with:
          pattern: wheels-*
          path: dist
          merge-multiple: true

      # Tags with a suffix (e.g. "v3.1.7-rc1") are published as pre-releases.
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          prerelease=""
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then prerelease="--prerelease"; fi
          gh release create "$GITHUB_REF_NAME" dist/*.whl --generate-notes $prerelease

      # Adds the new wheels to the package index on GitHub Pages (pre-releases
      # are not in it). Run on master: the "github-pages" environment only
      # accepts deployments from the default branch, not from tags.
      - name: Update package index
        if: ${{ !contains(github.ref_name, '-') }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run index.yml --ref master
