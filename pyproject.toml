# PEP 518
[build-system]
requires = ["scikit-build-core"]
build-backend = "scikit_build_core.build"

# PEP 621
[project]
name = "qi"
description = "LibQi Python bindings (unofficial community fork)"
version = "3.1.6"
readme = "README.md"
requires-python = ">=3.7"
license = { "file" = "COPYING" }
keywords=[
    "libqi",
    "qi",
    "naoqi",
    "aldebaran",
    "robotics",
    "robot",
    "nao",
    "pepper",
    "romeo",
    "plato",
]
classifiers=[
    "Development Status :: 4 - Beta",
    "License :: OSI Approved :: BSD License",
    "Intended Audience :: Developers",
    "Topic :: Software Development :: Libraries",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
    "Topic :: Software Development :: Embedded Systems",
    "Framework :: Robot Framework :: Library",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.7",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3 :: Only",
]
# Original authors (upstream aldebaran/libqi-python). They do not maintain this fork.
authors = [
    { name = "Aldebaran Robotics / SoftBank Robotics Europe" },
]
maintainers = [
    { name = "Thibault Hervier", email = "thibault@fr2g.io" },
]

[project.urls]
repository = "https://github.com/funwithagents/libqi-python"
upstream = "https://github.com/aldebaran/libqi-python"

[tool.scikit-build]
# Rely only on CMake install, not on Python packages detection.
wheel.packages = []

[tool.scikit-build.cmake.define]
# Disable building tests by default when building a wheel.
BUILD_TESTING = "OFF"

# Wheels building with cibuildwheel (used by the GitHub Actions workflow, can
# also be run locally, see README).
# The C++ dependencies are built once with Conan in `before-all`, then reused
# for every Python version.
[tool.cibuildwheel]
build = "cp310-* cp311-* cp312-* cp313-* cp314-* cp315-*"
skip = "*-musllinux_*"
archs = ["native"]
build-frontend = "build"
config-settings = { "cmake.define.CMAKE_TOOLCHAIN_FILE" = "{project}/build/conan/generators/conan_toolchain.cmake" }
test-command = "python {project}/ci/smoke_test.py"

[tool.cibuildwheel.linux]
# glibc >= 2.28: Debian 10+, Ubuntu 20.04+, RHEL 8+, ...
manylinux-x86_64-image = "manylinux_2_28"
manylinux-aarch64-image = "manylinux_2_28"
# Build every dependency from sources, so that they are linked against the
# glibc of the manylinux image (precompiled Conan binaries may require a newer
# one). Perl modules are needed to build OpenSSL.
before-all = [
    "yum install -y perl-IPC-Cmd perl-Digest-SHA",
    "pipx install 'conan>=2'",
    "CONAN_BUILD='*' bash {project}/ci/build_deps.sh {project}",
]
repair-wheel-command = "LD_LIBRARY_PATH={project}/build/conan/lib auditwheel repair -w {dest_dir} {wheel}"

[tool.cibuildwheel.macos]
# Conan must be installed beforehand (`pipx install conan`).
before-all = "bash {project}/ci/build_deps.sh {project}"
environment = { MACOSX_DEPLOYMENT_TARGET = "11.0" }
repair-wheel-command = "DYLD_LIBRARY_PATH={project}/build/conan/lib delocate-wheel --require-archs {delocate_archs} -w {dest_dir} -v {wheel}"
